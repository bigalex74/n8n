<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Батя</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: var(--tg-theme-bg-color, #f0f2f5); --card: var(--tg-theme-secondary-bg-color, #fff); --text: var(--tg-theme-text-color, #222); --button: var(--tg-theme-button-color, #3390ec); }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .back { color: var(--button); text-decoration: none; font-weight: 600; }
    .app-card { display: flex; align-items: center; margin-top: 18px; padding: 16px; border-radius: 14px; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.1); color: inherit; text-decoration: none; }
    .app-icon { margin-right: 16px; font-size: 32px; }
    .app-title { display: block; font-size: 16px; font-weight: 600; }
    .app-desc { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <a class="back" href="/">← В меню</a>
  <a href="/invest" class="app-card">
    <span class="app-icon">📈</span>
    <span><span class="app-title">Инвест-Навигатор</span><span class="app-desc">Лучшие инвестиционные предложения РФ</span></span>
  </a>
  <script>window.Telegram?.WebApp?.expand();</script>
</body>
</html>
