<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Инвест-Навигатор РФ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #f0f2f5;
            --tg-theme-secondary-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-button-color: #3390ec;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #8e8e93;
            --risk-low: #34c759;
            --risk-medium: #ff9500;
            --risk-high: #ff3b30;
            --accent-blue: #007aff;
        }
        body {
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; padding-bottom: 120px;
        }

        .top-tabs {
            position: sticky; top: 0; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(15px); display: flex; padding: 8px;
            gap: 8px; z-index: 1000; border-bottom: 1px solid #eee;
        }
        .tab-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: none;
            font-weight: 700; font-size: 14px; cursor: pointer;
            background: none; color: var(--tg-theme-hint-color);
        }
        .tab-btn.active { background: var(--tg-theme-button-color); color: #fff; }

        .view { display: none; padding: 12px; }
        .view.active { display: block; }

        .category-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 20px; padding: 16px; margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer;
        }
        .cat-main { display: flex; justify-content: space-between; align-items: center; }
        .cat-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .cat-yield-max { font-size: 13px; font-weight: 700; color: var(--risk-low); background: #f0fdf4; padding: 4px 10px; border-radius: 8px; }

        .offer-item { border-top: 1px solid #f0f0f0; margin-top: 16px; padding-top: 16px; animation: fadeIn 0.3s ease; }
        .offer-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .offer-name { font-weight: 700; font-size: 16px; }
        .offer-yield { font-weight: 800; color: var(--accent-blue); }

        .calc-box {
            background: #fff9f0; border: 1px solid #ffe8cc; border-radius: 14px;
            padding: 12px; margin: 12px 0; font-size: 13px;
        }
        .calc-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .calc-final { 
            border-top: 1px dashed #ffd8a8; margin-top: 8px; padding-top: 8px;
            font-weight: 800; color: #e67e22; font-size: 15px;
        }

        .offer-desc { font-size: 13px; color: #666; line-height: 1.4; margin-bottom: 10px; }
        
        .action-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-small { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-primary { background: var(--tg-theme-button-color); color: #fff; }
        .btn-secondary { background: #e8f5e9; color: #2e7d32; }

        .portfolio-item { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; padding: 16px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-top: 1px solid #eee; display: flex; gap: 10px; z-index: 100; }
        
        #modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: flex-end; }
        #modal-sheet { background: #fff; width: 100%; border-radius: 24px 24px 0 0; padding: 24px; padding-bottom: 40px; }
        .modal-input { width: 100%; padding: 16px; border: 2px solid #eee; border-radius: 16px; font-size: 24px; text-align: center; margin-bottom: 20px; box-sizing: border-box; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="top-tabs">
        <button class="tab-btn active" onclick="showView('search-view', this)">🔎 Витрина</button>
        <button class="tab-btn" onclick="showView('portfolio-view', this)">💼 Портфель</button>
    </div>

    <div id="search-view" class="view active">
        <div id="categories-list"></div>
    </div>

    <div id="portfolio-view" class="view">
        <div style="text-align:center; margin-bottom:20px; padding-top:10px;">
            <p style="color:var(--tg-theme-hint-color); font-size:13px; margin:0;">Всего вложено</p>
            <h1 id="total-invested" style="margin:4px 0; color:var(--accent-blue);">0 ₽</h1>
        </div>
        <div id="portfolio-list"></div>
    </div>

    <div id="modal-overlay" onclick="closeModal()">
        <div id="modal-sheet" onclick="event.stopPropagation()">
            <div style="font-size: 18px; font-weight: 800; margin-bottom: 16px; text-align: center;">Сумма вложений</div>
            <input type="number" class="modal-input" id="amount-input" placeholder="0" inputmode="decimal">
            <button class="btn-small btn-primary" style="width:100%; padding:16px; font-size:16px;" onclick="confirmAdd()">💾 Сохранить</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="btn-small btn-primary" onclick="updateOffers()">🔄 Обновить рынок</button>
        <button class="btn-small" style="background:#efeff4; color:#000;" onclick="window.location.href='/'">⬅ Меню</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        const user_id = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : 12345;

        let allOffers = [];
        let myPortfolio = [];
        let currentOfferId = null;

        const categoryIcons = { 'Вклады': '🏦', 'Облигации': '📜', 'Акции': '📈', 'Краудлендинг': '🤝', 'ЦФА': '💎', 'Недвижимость': '🏠' };

        function calculateNetYield(gross, category, risk, liquidity) {
            let tax = 0.13;
            let defaultRisk = 0;
            let exitFee = 0;

            if (category === 'Вклады') tax = 0;
            if (category === 'Краудлендинг') defaultRisk = 0.03;
            if (category === 'Облигации' && risk === 'High') defaultRisk = 0.02;

            // Расчет комиссии за выход (ликвидность)
            if (liquidity === 'Medium') exitFee = 0.005; // 0.5% (спред + брокер)
            if (liquidity === 'Low') exitFee = 0.03; // 3.0% (дисконт за срочность)

            const taxAmount = gross * tax;
            const net = gross - taxAmount - (defaultRisk * 100) - (exitFee * 100);

            return {
                net: net.toFixed(1),
                taxPerc: (tax * 100).toFixed(0),
                riskPerc: (defaultRisk * 100).toFixed(0),
                exitPerc: (exitFee * 100).toFixed(1)
            };
        }

        async function loadData() {
            const resO = await fetch('/api/invest/offers');
            allOffers = await resO.json();
            const resP = await fetch(`/api/invest/portfolio?user_id=${user_id}`);
            myPortfolio = await resP.json();
            renderCategories();
            renderPortfolio();
        }

        function renderCategories() {
            const container = document.getElementById('categories-list');
            container.innerHTML = '';
            const grouped = allOffers.reduce((a, b) => { (a[b.category] = a[b.category] || []).push(b); return a; }, {});

            for (const [cat, offers] of Object.entries(grouped)) {
                const maxYield = Math.max(...offers.map(o => parseFloat(o.yield_percent)));
                const card = document.createElement('div');
                card.className = 'category-card';
                card.innerHTML = `
                    <div class="cat-main" onclick="toggleCat(this)">
                        <div class="cat-title"><span>${categoryIcons[cat] || '💰'}</span> ${cat}</div>
                        <div class="cat-yield-max">до ${maxYield}%</div>
                    </div>
                    <div class="cat-details" style="display:none;">
                        ${offers.map(o => {
                            const math = calculateNetYield(o.yield_percent, o.category, o.risk_level, o.liquidity_level);
                            return `
                                <div class="offer-item">
                                    <div class="offer-header">
                                        <span class="offer-name">${o.title}</span>
                                        <span class="offer-yield">${o.yield_percent}%</span>
                                    </div>
                                    <div class="offer-desc">📌 ${o.description}</div>
                                    
                                    <div class="calc-box">
                                        <div style="font-weight:800; margin-bottom:6px; color:#d48806;">🧮 Честная математика:</div>
                                        <div class="calc-row"><span>Маркетинговая ставка:</span> <span>${o.yield_percent}%</span></div>
                                        <div class="calc-row"><span>Налог (НДФЛ):</span> <span style="color:#cf1322;">-${math.taxPerc}%</span></div>
                                        ${math.riskPerc > 0 ? `<div class="calc-row"><span>Риск дефолта:</span> <span style="color:#cf1322;">-${math.riskPerc}%</span></div>` : ''}
                                        ${math.exitPerc > 0 ? `<div class="calc-row"><span>Комиссия за выход:</span> <span style="color:#cf1322;">-${math.exitPerc}%</span></div>` : ''}
                                        <div class="calc-final">РЕАЛЬНЫЙ ДОХОД: ~${math.net}% годовых</div>
                                    </div>

                                    <div style="font-size:12px; color:#888;">💰 Вход от ${o.min_amount} | 🛡 Риск: ${o.risk_level}</div>
                                    
                                    <div class="action-row">
                                        <button class="btn-small btn-secondary" onclick="openModal(${o.id})">➕ В портфель</button>
                                        <button class="btn-small btn-primary" onclick="tg.openLink('${o.link}')">🚀 Перейти</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                container.appendChild(card);
            }
        }

        function toggleCat(el) {
            const details = el.nextElementSibling;
            const isHidden = details.style.display === 'none';
            details.style.display = isHidden ? 'block' : 'none';
            if (isHidden) el.parentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderPortfolio() {
            const container = document.getElementById('portfolio-list');
            container.innerHTML = myPortfolio.length ? '' : '<p style="text-align:center; padding:40px; color:#888;">Пусто.</p>';
            let total = 0;
            myPortfolio.forEach(p => {
                total += parseFloat(p.amount);
                const div = document.createElement('div');
                div.className = 'portfolio-item';
                div.innerHTML = `
                    <div style="flex:1;">
                        <span style="font-weight:700; display:block;">${p.title}</span>
                        <span style="font-size:11px; color:#888;">${new Date(p.created_at).toLocaleDateString()}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div style="font-weight:800; color:var(--accent-blue);">${parseFloat(p.amount).toLocaleString()} ₽</div>
                        <button onclick="removeItem(${p.id}, event)" style="background:none; border:none; font-size:18px;">🗑</button>
                    </div>
                `;
                container.appendChild(div);
            });
            document.getElementById('total-invested').innerText = total.toLocaleString() + ' ₽';
        }

        function openModal(id) { currentOfferId = id; document.getElementById('modal-overlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

        async function confirmAdd() {
            const amount = document.getElementById('amount-input').value;
            if (!amount) return;
            await fetch('/api/invest/portfolio', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id, offer_id: currentOfferId, amount })
            });
            closeModal();
            loadData();
        }

        async function removeItem(id, e) {
            e.stopPropagation();
            if (confirm("Удалить?")) {
                await fetch(`/api/invest/portfolio/${id}?user_id=${user_id}`, { method: 'DELETE' });
                loadData();
            }
        }

        async function updateOffers() {
            const btn = document.querySelector('.btn-primary');
            btn.innerText = "⏳ Обновляем...";
            await fetch('/api/invest/update', { method: 'POST' });
            await loadData();
            btn.innerText = "🔄 Обновить рынок";
        }

        function showView(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        loadData();
    </script>
</body>
</html>
