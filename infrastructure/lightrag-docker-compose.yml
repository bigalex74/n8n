services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    network_mode: host
    restart: always
    volumes:
      - ollama_storage:/root/.ollama

  lightrag:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: lightrag
    network_mode: host
    restart: always
    volumes:
      - /home/user/lightrag/inputs:/app/inputs
      - /home/user/lightrag/outputs:/app/outputs
      - /home/user/lightrag/dict:/app/dict

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    container_name: open-webui
    restart: always
    network_mode: host
    volumes:
      - open-webui-data:/app/backend/data

  apps-hub:
    build:
      context: /home/user/telegram-apps
      dockerfile: Dockerfile
    container_name: apps-hub
    restart: always
    network_mode: host
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?Resolve TELEGRAM_BOT_TOKEN at deploy time}
      - OCR_BATCH_TRIGGER_TOKEN=${OCR_BATCH_TRIGGER_TOKEN:?Resolve OCR_BATCH_TRIGGER_TOKEN at deploy time}
      - OCR_BATCH_WEBHOOK_URL=http://127.0.0.1:5678/webhook/ocr-yandex-korean-batch
      - OCR_DELETE_TXT_WEBHOOK_URL=http://127.0.0.1:5678/webhook/ocr-yandex-delete-txt
      - OCR_REVIEW_PUBLISH_WEBHOOK_URL=http://127.0.0.1:5678/webhook/ocr-yandex-review-publish
      - OCR_OWNER_ID=923741104
      - OCR_OWNER_USERNAME=bigalex_an
      - OCR_OPERATOR_IDS=1011396552
      - OCR_SERVICE_HEALTH_URL=http://127.0.0.1:8765/health
      - AI_OCR_SERVICE_HEALTH_URL=http://127.0.0.1:8766/health
      - TELEGRAM_INIT_DATA_MAX_AGE=86400
    depends_on:
      - ollama
    volumes:
      - /home/user/telegram-apps:/app

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  ollama_storage:
  open-webui-data:
  sd-data:
  portainer_data:
